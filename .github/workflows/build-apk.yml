{
  "name": "lingovault",
  "version": "1.3.2",
  "description": "LingoVault 1 — vocabulary & grammar with spaced repetition",
  "author": "Alireza Taranejoo <Alireza.taranejoo@gmail.com>",
  "private": true,
  "scripts": {
    "cap:init": "npx cap init LingoVault com.lingovault.app --web-dir www",
    "www": "node scripts/prepare-www.js",
    "build": "node scripts/prepare-www.js",
    "sync": "npm run www && npx cap sync",
    "android": "npm run sync && npx cap open android",
    "build:apk": "npm run www && npx cap sync android && cd android && ./gradlew assembleDebug",
    "cap:add": "npx cap add android"
  },
  "dependencies": {
    "@capacitor/android": "^6.2.0",
    "@capacitor/core": "^6.2.0"
  },
  "devDependencies": {
    "@capacitor/cli": "^6.2.0"
  }
}
