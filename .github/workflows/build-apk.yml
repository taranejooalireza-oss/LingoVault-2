name: Build LingoVault APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        shell: bash
        run: |
          echo "Searching for ZIP files..."

          ZIP_FILE=$(find . -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found anywhere in repository."
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          echo "Extracting:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction completed."

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort | head -200

      - name: Locate project
        shell: bash
        run: |
          echo "Searching for package.json..."

          PROJECT_DIR=$(find extracted -name package.json -type f -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found inside ZIP."
            echo "Extracted directory:"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Copy project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          shopt -s dotglob

          cp -R "$PROJECT_DIR"/* project/

          echo "Project root:"
          ls -la project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Prepare web files
        working-directory: project
        run: npm run www

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Check Android project
        working-directory: project
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            echo "Android project not found."
            echo "Creating Android project..."
            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Sync Capacitor
        working-directory: project
        run: npx cap sync android

      - name: Build APK
        working-directory: project/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingoVault-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
